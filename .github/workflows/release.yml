name: Release BatFlow

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Release runs must not overlap: two of them would read the same "latest tag"
# and compute the same next version. PR runs are per-PR and safe to cancel.
concurrency:
  group: release-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # also fetches tags, needed to compute the next version

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            major="${major#v}"
            case "${{ github.event.inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Version: $tag"

      - name: Build BatFlow.app
        run: |
          set -euo pipefail
          swift build -c release
          binary="$(swift build -c release --show-bin-path)/BatFlow"

          mkdir -p BatFlow.app/Contents/MacOS
          cp "$binary" BatFlow.app/Contents/MacOS/BatFlow

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.short }}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.short }}" Info.plist
          cp Info.plist BatFlow.app/Contents/Info.plist

          codesign -s - --force BatFlow.app

      - name: Verify bundle
        run: |
          set -euo pipefail
          app=BatFlow.app
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          test -x "$app/Contents/MacOS/BatFlow"

          stamped=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [[ "$stamped" != "${{ steps.version.outputs.short }}" ]]; then
            echo "::error::Bundle reports version $stamped, expected ${{ steps.version.outputs.short }}"
            exit 1
          fi
          echo "OK: $stamped, $(lipo -archs "$app/Contents/MacOS/BatFlow")"

      - name: Package
        run: ditto -c -k --keepParent BatFlow.app BatFlow-macOS.zip

      # Lets you download and run the build straight from a pull request.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BatFlow-${{ steps.version.outputs.tag }}
          path: BatFlow-macOS.zip

      - name: Tag and publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists, nothing to publish"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi

          gh release create "$tag" BatFlow-macOS.zip \
            --title "BatFlow $tag" \
            --generate-notes \
            --target "$GITHUB_SHA"
