name: Release BatFlow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS App & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [[ -z "$LATEST_TAG" ]]; then
              TAG="v0.1.0"
            else
              VERSION="${LATEST_TAG#v}"
              MAJOR="${VERSION%%.*}"
              REST="${VERSION#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build BatFlow.app
        run: |
          mkdir -p build/cache
          mkdir -p BatFlow.app/Contents/MacOS
          mkdir -p BatFlow.app/Contents/Resources

          swift build -c release
          cp .build/release/BatFlow BatFlow.app/Contents/MacOS/BatFlow

          cp Info.plist BatFlow.app/Contents/Info.plist

      - name: Ad-hoc Code Sign
        run: codesign -s - --force --deep BatFlow.app

      - name: Package into ZIP
        run: |
          ditto -c -k --keepParent BatFlow.app BatFlow-macOS.zip
          echo "Built: $(du -sh BatFlow-macOS.zip | cut -f1)"

      - name: Tag Release
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" BatFlow-macOS.zip \
            --title "BatFlow $TAG" \
            --generate-notes \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
