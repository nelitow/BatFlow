name: Release BatFlow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS App & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build BatFlow.app
        run: |
          mkdir -p build/cache
          mkdir -p BatFlow.app/Contents/MacOS
          mkdir -p BatFlow.app/Contents/Resources

          swift build -c release
          cp .build/release/BatFlow BatFlow.app/Contents/MacOS/BatFlow

          cp Info.plist BatFlow.app/Contents/Info.plist

      - name: Ad-hoc Code Sign
        run: codesign -s - --force --deep BatFlow.app

      - name: Package into ZIP
        run: |
          ditto -c -k --keepParent BatFlow.app BatFlow-macOS.zip
          echo "Built: $(du -sh BatFlow-macOS.zip | cut -f1)"

      - name: Delete existing 'latest' release (if re-releasing)
        if: steps.version.outputs.tag == 'latest'
        run: |
          gh release delete latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [[ "$TAG" == "latest" ]]; then
            TITLE="BatFlow — Latest Build"
            NOTES="Automatically built from the latest commit on \`main\`."
            gh release create "$TAG" BatFlow-macOS.zip \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target main
          else
            gh release create "$TAG" BatFlow-macOS.zip \
              --title "BatFlow $TAG" \
              --generate-notes \
              --target main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
